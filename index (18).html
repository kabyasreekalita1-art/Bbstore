let db=J("bb_db")||seed(),cart=J("bb_cart",[]),me="";let wl=J("bb_wl",[]);db.rev=db.rev||[];const D={popup:1,pt:"Welcome to B Boruah Store",pm:"Apna grocery saaman ghar se order karein. Hum taiyar rakhenge, aap dukaan par aakar payment karke le jaayein.",offer:"Ghar se order karein, dukaan par aakar payment karke saaman le jaayein.",banner:"UP TO 30% OFF|Chune hue saamaan par\nRoz ki zarurat|Sabse achhe daam par\nTaaza & Healthy|Behtar jeevan ke liye",wa:"918453840268",cod:1,upi:1,upiid:"",hrs:"8 AM - 8 PM",about:"B Boruah Store, Sankarpur (3 No Kaki) ka bharosemand grocery store. Aap ghar se order karein, hum saaman taiyar rakhenge aur aap dukaan par aakar payment karke le jaayein."};db.set=Object.assign({},D,db.set||{});["offer","pm"].forEach(k=>{if(/delivery|ghar baithe/i.test(db.set[k]||""))db.set[k]=D[k]});

const A={
menu:()=>{ST.mn=!ST.mn;hd()},srch:()=>{ST.sr=!ST.sr;hd();setTimeout(()=>document.querySelector(".sr input")?.focus(),50)},
wl:id=>{wl=wl.includes(id)?wl.filter(x=>x!==id):[...wl,id];localStorage.bb_wl=JSON.stringify(wl);view()},
again:id=>{const o=db.orders.find(x=>x.id===id);o.items.forEach(i=>{const p=P(i.id);if(p&&p.on&&p.stock>0){const c=cart.find(x=>x.id===i.id);if(c)c.q=Math.min(p.stock,c.q+i.qty);else cart.push({id:i.id,q:Math.min(p.stock,i.qty)})}});save();location.hash="#/cart"},
csv:()=>{const r=[["ID","Date","Name","Phone","Village","Items","Total","Payment","Status"],...db.orders.map(o=>[o.id,new Date(o.ts).toLocaleString("en-IN"),o.name,o.phone,o.addr,o.items.map(i=>i.name+" x"+i.qty).join(" | "),o.total,o.method+"/"+o.pay,pst(o)])],b=new Blob(["\ufeff"+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="orders.csv";a.click()},

qa:id=>{const p=P(id),c=cart.find(x=>x.id===id);if(c)c.q=Math.min(p.stock,c.q+1);else cart.push({id,q:1});track("ATC");save();view();toast("✔ Cart me add ho gaya")},
buy:id=>{A.add(id);location.hash="#/checkout"},of:k=>{ST.of=k;view()},
img:i=>{ST.img=+i;view()},q:i=>{ST.qty=Math.max(1,Math.min(P(ST.last).stock,ST.qty+ +i));view()},
add:id=>{const p=P(id),c=cart.find(x=>x.id===id);if(c)c.q=Math.min(p.stock,c.q+ST.qty);else cart.push({id,q:ST.qty});track("ATC");save();location.hash="#/cart"},
cq:i=>{const[id,d]=i.split(":"),c=cart.find(x=>x.id===id);c.q=Math.max(1,Math.min(P(id).stock,c.q+ +d));save();view()},
rm:id=>{cart=cart.filter(x=>x.id!==id);save();view()},out:()=>{me="";delete localStorage.bb_me;location.hash="#/";view()},
mode:m=>{ST.mode=m;ST.err="";view()},cp:i=>{ST.cp=i;view()},delr:i=>{db.rev=db.rev.filter(r=>r.id!==i);save();view()},tab:t=>{ST.cp="";ST.tab=t;ST.ed=null;ST.err="";view()},lock:()=>{delete sessionStorage.bb_adm;view()},

editp:id=>{ST.ed=structuredClone(P(id));view()},

delc:id=>{if(confirm("Delete this category? Its products stay, without a category.")){db.cats=db.cats.filter(c=>c.id!==id);save();view()}},
rmimg:i=>{snap();ST.ed.imgs.splice(+i,1);view()},rmshop:()=>{delete db.set.shop;save();view()}};

search(f){ST.sr=0;ST.mn=0;const h="#/s/"+encodeURIComponent(g(f,"q").trim());if(location.hash===h)view();else location.hash=h},
adm(f){if(g(f,"p")===(db.set.pw||CFG.ADMIN_PASS)){sessionStorage.bb_adm=1;ST.err="";view()}else err("Wrong password.")},
async auth(f){const id=g(f,"uid").trim().toLowerCase(),pw=g(f,"pw");if(!(/^[6-9]\d{9}$/.test(id)||/^\S+@\S+\.\S+$/.test(id))||pw.length<8)return err("Enter a valid 10-digit mobile number or email, and a password of 8+ characters.");

else if(!u||u.h!==h)return err("Wrong mobile/email or password.");
me=id;localStorage.bb_me=id;ST.err="";save();location.hash="#/";view()},

prof(f){const d={name:g(f,"name").trim(),phone:g(f,"phone").trim(),addr:g(f,"addr").trim()};if(!/^[6-9]\d{9}$/.test(d.phone))return alert("Sahi 10-digit mobile number daalein.");localStorage.bb_cust=JSON.stringify(d);view()},

e.name=e.name.trim();e.sale=e.sale||null;if(e.id)Object.assign(P(e.id),e);else{e.id="p"+Date.now().toString(36);e.ts=Date.now();db.prods.push(e)}ST.ed=null;ST.err="";save();view()},
