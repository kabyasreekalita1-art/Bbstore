<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B Baruah Store</title><meta name="description" content="Fresh groceries from B Baruah Store. Pay online or on delivery.">
<style>
:root{--g:#0b6b34;--gd:#064a22;--y:#f7b500;--bg:#f3f7f3}*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#16261b}
h1,h2,h3{font-family:Georgia,serif;margin:.4em 0}a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:auto;padding:0 16px}main{padding-bottom:30px;min-height:60vh}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;box-shadow:0 2px 8px #0003}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.logo{font-size:22px;font-weight:700;font-family:Georgia,serif}.sr{flex:1;min-width:220px;display:flex}
.sr input{border-radius:99px 0 0 99px;border:0}.sr button{border:0;background:var(--y);border-radius:0 99px 99px 0;padding:0 18px;cursor:pointer}
nav{display:flex;gap:16px;align-items:center;margin-left:auto;font-size:14px}header .btn2{background:#fff3;color:#fff}
input,select,textarea{font:inherit;padding:11px 14px;border:1px solid #0003;border-radius:12px;background:#fff;width:100%}
select{width:auto;padding:6px 10px}input[type=checkbox],input[type=radio]{width:auto}
.btn,.btn2{display:inline-block;border:0;border-radius:99px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn{background:var(--g);color:#fff}.btn.y{background:var(--y);color:#222}.btn2{background:#0b6b341a;color:var(--g)}
.lnk{background:none;border:0;font:inherit;cursor:pointer;padding:0;color:inherit;opacity:.8}.red{color:#c62828}.gr{color:var(--g);font-weight:600}.muted{opacity:.7}.pre{white-space:pre-line}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 4px #0002}.pc{padding:0;overflow:hidden}
.im,.big{aspect-ratio:1;background:#eef3ec;position:relative;overflow:hidden;border-radius:12px}.pc .im{border-radius:0}
.im img,.big img{width:100%;height:100%;object-fit:cover}.ph{display:grid;place-items:center;height:100%;font-size:56px}
.off{position:absolute;left:8px;top:8px;background:var(--y);border-radius:99px;padding:2px 9px;font-size:12px}.pi{padding:10px}s{opacity:.5}
.hero{background:linear-gradient(120deg,var(--gd),var(--g) 60%,#2f9e5a);color:#fff;border-radius:24px;padding:40px 28px;margin-top:16px;position:relative;overflow:hidden}
.hero .em{position:absolute;right:16px;bottom:0;font-size:90px;opacity:.9}.hero p{max-width:380px}
.chips{display:flex;gap:16px;overflow-x:auto;padding:6px 0 14px}.chips a{text-align:center;font-size:12px;width:80px;flex:none}
.chips span{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 4px;border-radius:50%;background:#fff;border:2px solid #0b6b3433;font-size:30px}
.promos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:18px 0}
.pm{border-radius:18px;padding:20px;color:#fff;position:relative;overflow:hidden;min-height:120px}.pm b{font-size:22px;display:block}.pm span{position:absolute;right:12px;bottom:0;font-size:64px}
.cta{background:var(--gd);color:#fff;border-radius:20px;padding:24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:28px}
.two{display:grid;gap:24px;margin-top:20px}@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.ths{display:flex;gap:8px;margin-top:8px}.ths button{width:60px;height:60px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:none;cursor:pointer}.ths .on{border-color:var(--g)}.ths img{width:100%;height:100%;object-fit:cover}
.pp{font-size:30px;font-weight:700}.qty{display:flex;align-items:center;gap:12px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}.f1{flex:1}.sm{width:56px;height:56px;border-radius:10px;overflow:hidden;background:#eef3ec}.sm .ph{font-size:28px}.sm img{width:100%;height:100%;object-fit:cover}
.mid{max-width:660px;margin:24px auto;display:grid;gap:10px}.stack{display:grid;gap:10px;margin-top:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps{display:flex;gap:8px;flex-wrap:wrap}.steps span{background:#fff;border-radius:99px;padding:4px 14px;font-size:13px;box-shadow:0 1px 2px #0002}
.trk{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;list-style:none;padding:0;text-align:center;font-size:11px}.trk i{display:block;height:8px;border-radius:9px;background:#0002;margin-bottom:4px}.trk .on i{background:var(--g)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;align-items:center}.st{font-size:24px}
.fb{height:10px;background:#0002;border-radius:9px;margin-bottom:8px}.fb i{display:block;height:10px;background:var(--g);border-radius:9px}
.bd{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:#0b6b341a;color:var(--g)}.bd.x{background:#c628281a;color:#c62828}.bd.w{background:#f7b5001f;color:#9a6b00}
details summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}details summary::-webkit-details-marker{display:none}details[open]>summary{margin-bottom:8px}
.auth{display:grid;max-width:900px;margin:24px auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 2px 12px #0002}@media(min-width:760px){.auth{grid-template-columns:1fr 1fr}}
.pane{padding:32px;display:grid;gap:10px;align-content:center}.side2{background:linear-gradient(140deg,var(--g),#2f9e5a);color:#fff;padding:32px;display:grid;align-content:center;text-align:center}.side2 .em{font-size:90px}
.adm{display:grid;gap:16px;margin-top:16px}@media(min-width:860px){.adm{grid-template-columns:200px 1fr}}
.side{background:var(--gd);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;align-self:start}@media(max-width:859px){.side{flex-direction:row;overflow-x:auto}}
.side button{background:none;border:0;color:#cfe5d6;text-align:left;padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;white-space:nowrap}.side .on{background:#fff2;color:#fff;font-weight:600}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px}.chart div{flex:1;text-align:center;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.chart i{display:block;background:var(--g);border-radius:6px 6px 0 0;min-height:2px}
footer{background:var(--gd);color:#dfeee3;padding:26px 0;font-size:14px}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px}footer h3{color:#fff;font-size:16px}footer a{display:block;margin:4px 0;opacity:.85}
.pay{display:flex;gap:6px;flex-wrap:wrap}.pay span{background:#fff;color:#222;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.wa{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 4px 14px #0005;z-index:9}.wa[hidden]{display:none}.wa svg{width:30px;height:30px;fill:#fff}
</style></head><body>
<header id="hd"></header><main id="app" class="wrap"></main><footer id="ft"></footer><a id="wa" class="wa" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></a>
<script>
/* ===== SETTINGS: edit these ===== */
const CFG={STORE:"B Baruah Store",EMAIL:"kazerateam@gmail.com",WHATSAPP:"",ADDRESS:"Guwahati, Assam, India",ADMIN_PATH:"manage-bb",ADMIN_PASS:"admin123",RAZORPAY_KEY:"",DELIVERY:40,FREE_ABOVE:499};
/* ================================ */
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),inr=n=>"₹"+Number(n).toLocaleString("en-IN");
const J=(k,d)=>{try{return JSON.parse(localStorage[k])||d}catch{return d}},g=(f,k)=>f.elements[k].value;
function seed(){const c=[["Rice & Atta","🌾"],["Dal & Pulses","🫘"],["Oil & Masala","🫙"],["Tea & Snacks","🍵"]].map((x,i)=>({id:"c"+i,name:x[0],icon:x[1]}));
const p=(n,ci,pr,sp,st,f)=>({id:"p"+Math.random().toString(36).slice(2,8),name:n,desc:"Sample product. Edit or delete it in the admin panel.",cat:"c"+ci,price:pr,sale:sp||null,stock:st,on:true,feat:!!f,imgs:[],ts:Date.now()});
return{cats:c,prods:[p("Basmati Rice 5 kg",0,650,599,50,1),p("Aata 5 kg",0,260,0,40),p("Toor Dal 1 kg",1,160,149,30,1),p("Mustard Oil 1 L",2,180,0,25),p("Assam Tea 500 g",3,240,219,60,1),p("Garam Masala 100 g",2,70,0,80)],users:[],orders:[],ev:[]}}
let db=J("bb_db")||seed(),cart=J("bb_cart",[]),me=localStorage.bb_me||"";
const ST={qty:1,img:0,tab:"Dashboard",of:"ALL",od:{},ed:null,mode:"login",err:"",last:"",cs:0,m:"COD"};
const save=()=>{try{localStorage.bb_db=JSON.stringify(db);localStorage.bb_cart=JSON.stringify(cart)}catch(e){alert("Browser storage is full. Remove some product photos.")}};
const vid=localStorage.bb_vid||(localStorage.bb_vid=Math.random().toString(36).slice(2));
const track=t=>{db.ev.push({t,v:vid,ts:Date.now()});if(db.ev.length>5000)db.ev.splice(0,500);save()};
const user=()=>db.users.find(u=>u.id===me),P=id=>db.prods.find(p=>p.id===id),pr=p=>p.sale&&p.sale<p.price?p.sale:p.price;
const ico=p=>(db.cats.find(c=>c.id===p.cat)||{}).icon||"🛒",act=()=>db.prods.filter(p=>p.on);
const thumb=(p,i=0)=>p.imgs[i]?`<img src="${p.imgs[i]}" alt="${esc(p.name)}">`:`<div class="ph">${ico(p)}</div>`;
const sha=async s=>crypto.subtle?[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join(""):btoa(unescape(encodeURIComponent(s)));
const lines=()=>cart.map(c=>({p:P(c.id),q:c.q})).filter(l=>l.p&&l.p.on);
const tot=()=>{const s=lines().reduce((a,l)=>a+pr(l.p)*l.q,0),d=s&&s<CFG.FREE_ABOVE?CFG.DELIVERY:0;return{s,d,t:s+d}};
const err=m=>{ST.err=m;view()};
const STEPS=[["PLACED","Order Placed"],["CONFIRMED","Confirmed"],["PREPARING","Preparing"],["OUT","Out for Delivery"],["DELIVERED","Delivered"]];
async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,600/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*k;c.height=b.height*k;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.7)}
const loadRzp=()=>new Promise(r=>{if(window.Razorpay)return r();const s=document.createElement("script");s.src="https://checkout.razorpay.com/v1/checkout.js";s.onload=r;document.head.appendChild(s)});

const waMsg=o=>`New order ${o.id} from ${CFG.STORE}\n${o.items.map(i=>`${i.name} x${i.qty}`).join(", ")}\nTotal ${inr(o.total)} (${o.method==="COD"?"Cash on Delivery":"Online"})\n${o.name}, ${o.phone}\n${o.addr}, ${o.pin}`;
async function notify(o){try{await fetch("https://formsubmit.co/ajax/"+CFG.EMAIL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({_subject:`New order #${o.id} - ${inr(o.total)} (${o.method})`,_template:"table",_captcha:"false",Order:o.id,Customer:o.name,Phone:o.phone,Login:o.uid,Address:o.addr+", "+o.pin,Payment:(o.method==="COD"?"Cash on Delivery":"Online (Razorpay)")+" - "+o.pay+(o.pid?" - "+o.pid:""),Items:o.items.map(i=>`${i.name} x${i.qty} = ${inr(i.price*i.qty)}`).join(" | "),Subtotal:inr(o.sub),Delivery:inr(o.del),Total:inr(o.total)})})}catch(e){}}
function hd(){const u=user(),n=cart.reduce((a,c)=>a+c.q,0);
$("#hd").innerHTML=`<div class="wrap bar"><a class="logo" href="#/">🛒 ${esc(CFG.STORE)}</a>${u?`<form data-f="search" class="sr"><input name="q" placeholder="Search for products…" aria-label="Search products"><button aria-label="Search">🔍</button></form><nav><a href="#/orders">My Orders</a><a class="btn2" href="#/cart">🛒 Cart (${n})</a><button class="lnk" data-a="out">Sign out</button></nav>`:""}</div>`}
const card=p=>`<div class="card pc"><a href="#/p/${p.id}"><div class="im">${thumb(p)}${pr(p)<p.price?`<b class="off">${Math.round(100-p.sale/p.price*100)}% OFF</b>`:""}</div></a><div class="pi"><a href="#/p/${p.id}">${esc(p.name)}</a><div><strong>${inr(pr(p))}</strong> ${pr(p)<p.price?`<s>${inr(p.price)}</s>`:""}</div>${p.stock<1?`<div class="red">Out of stock</div>`:`<button class="btn" style="width:100%;margin-top:8px;padding:8px" data-a="qa" data-i="${p.id}">Add to Cart</button>`}</div></div>`;
const grid=l=>l.length?`<div class="grid">${l.map(card).join("")}</div>`:"<p>No products found.</p>";
const sec=(t,l)=>l.length?`<h2>${t}</h2>${grid(l)}`:"";
const chips=()=>`<h2>Shop by Category</h2><div class="chips">${db.cats.map(c=>`<a href="#/c/${c.id}"><span>${c.icon}</span>${esc(c.name)}</a>`).join("")}</div>`;
function home(){const l=act();return`<div class="hero"><h1 style="font-size:clamp(30px,5vw,52px);max-width:480px;margin:0 0 8px">Fresh Groceries Right at Your Doorstep</h1><p>Good food, healthy life, better tomorrow.</p><a class="btn y" href="#/s/">Shop Now</a><div class="em">🧺🥬🍅</div></div>${chips()}<div class="promos"><a class="pm" style="background:#0b6b34" href="#/s/"><b>UP TO 30% OFF</b>On selected grocery items<span>🥦</span></a><a class="pm" style="background:#e29a00" href="#/s/"><b>Everyday Essentials</b>At best prices<span>🌾</span></a><a class="pm" style="background:#2f9e5a" href="#/s/"><b>Fresh &amp; Healthy</b>Food for a better life<span>🍎</span></a></div>${sec("Offers",l.filter(p=>pr(p)<p.price).slice(0,8))}${sec("Featured Products",l.filter(p=>p.feat).slice(0,8))}${sec("New arrivals",[...l].sort((a,b)=>b.ts-a.ts).slice(0,8))}<div class="cta"><div class="f1"><h2 style="margin:0">Your Daily Grocery Needs, Simplified</h2>Fresh products, best prices, fast delivery.</div><a class="btn y" href="#/s/">Start Shopping</a></div>`}
function list(k,v){const l=act().filter(p=>k==="c"?p.cat===v:p.name.toLowerCase().includes(v.toLowerCase()));return chips()+`<h2>${k==="c"?esc((db.cats.find(c=>c.id===v)||{}).name||""):`Results for “${esc(v)}”`}</h2>`+grid(l)}
function prod(id){const p=P(id);if(!p||!p.on)return"<p>Product not found.</p>";if(ST.last!==id){ST.last=id;ST.qty=1;ST.img=0;track("PV")}
return`<div class="two"><div><div class="big">${thumb(p,ST.img)}</div><div class="ths">${p.imgs.map((s,i)=>`<button data-a="img" data-i="${i}" aria-label="Photo ${i+1}" class="${i===ST.img?"on":""}"><img src="${s}" alt=""></button>`).join("")}</div></div><div><h1>${esc(p.name)}</h1><div class="pp">${inr(pr(p))} ${pr(p)<p.price?`<s>${inr(p.price)}</s>`:""}</div><p class="${p.stock?"gr":"red"}">${p.stock?`In stock: ${p.stock} available`:"Out of stock"}</p>${p.stock?`<div class="qty"><button class="btn2" data-a="q" data-i="-1" aria-label="Decrease">−</button><b>${ST.qty}</b><button class="btn2" data-a="q" data-i="1" aria-label="Increase">+</button></div><button class="btn" data-a="add" data-i="${p.id}">Add to Cart</button> <button class="btn y" data-a="buy" data-i="${p.id}">Buy Now</button>`:""}<h3>Product Description</h3><p class="muted pre">${esc(p.desc)}</p><div class="steps"><span>✔ 100% Pure</span><span>✔ Premium Quality</span><span>✔ Fast Delivery</span></div></div></div>`}
function cartV(){const l=lines();if(!l.length)return`<div class="mid"><p>Your cart is empty.</p><a class="btn" href="#/">Start shopping</a></div>`;const t=tot();
return`<div class="mid"><h1>Your cart</h1>${l.map(({p,q})=>`<div class="card row"><div class="sm">${thumb(p)}</div><div class="f1"><b>${esc(p.name)}</b><div>${inr(pr(p))}</div></div><button class="btn2" data-a="cq" data-i="${p.id}:-1" aria-label="Decrease">−</button><b>${q}</b><button class="btn2" data-a="cq" data-i="${p.id}:1" aria-label="Increase">+</button><button class="lnk red" data-a="rm" data-i="${p.id}">Remove</button></div>`).join("")}<div class="card"><div class="row"><span class="f1">Subtotal</span>${inr(t.s)}</div><div class="row"><span class="f1">Delivery</span>${t.d?inr(t.d):"Free"}</div><div class="row"><b class="f1">Total</b><b>${inr(t.t)}</b></div></div><a class="btn" href="#/checkout">Proceed to checkout</a></div>`}
function checkout(){const l=lines();if(!l.length)return cartV();if(!ST.cs){ST.cs=1;track("CS")}const u=user(),t=tot(),on=!!CFG.RAZORPAY_KEY;
return`<form data-f="place" class="mid"><h1>Checkout</h1><div class="steps"><span>1 Delivery address</span><span>2 Payment method</span><span>3 Review &amp; place order</span></div><input name="name" placeholder="Full name" value="${esc(u.name)}"><input name="phone" inputmode="numeric" placeholder="10-digit phone number" value="${esc(u.phone)}"><textarea name="addr" rows="3" placeholder="Delivery address">${esc(u.addr)}</textarea><input name="pin" inputmode="numeric" placeholder="Area pincode" value="${esc(u.pin)}"><div class="card"><b>Order summary</b>${l.map(x=>`<div class="row"><span class="f1">${esc(x.p.name)} × ${x.q}</span>${inr(pr(x.p)*x.q)}</div>`).join("")}<div class="row"><b class="f1">Total (incl. delivery)</b><b>${inr(t.t)}</b></div></div><label class="card"><input type="radio" name="m" value="COD" ${ST.m==="COD"||!on?"checked":""}> Cash on Delivery</label><label class="card"><input type="radio" name="m" value="ONLINE" ${on?(ST.m==="ONLINE"?"checked":""):"disabled"}> Pay online: UPI, cards, net banking${on?"":" (not set up yet)"}</label><p class="red" role="alert">${ST.err}</p><button class="btn">Place order</button></form>`}
const bd=o=>o.st==="CANCELLED"?"x":o.st==="DELIVERED"?"":"w",pst=o=>o.st==="OUT"?"OUT FOR DELIVERY":o.st;
const oc=(o,op)=>`<details class="card" ${op?"open":""}><summary><b class="f1">#${o.id}</b><span class="bd ${bd(o)}">${pst(o)}</span><b>${inr(o.total)}</b><span class="btn2" style="padding:4px 12px">View Details</span></summary><div class="muted">${new Date(o.ts).toLocaleDateString("en-IN")}</div>${o.items.map(i=>`<div class="row"><span class="f1">${esc(i.name)} × ${i.qty}</span>${inr(i.price*i.qty)}</div>`).join("")}<p class="muted">${o.method==="COD"?"Cash on Delivery":"Online (Razorpay)"} · ${o.pay} · Delivery ${o.del?inr(o.del):"Free"} · <b>Total ${inr(o.total)}</b><br>${esc(o.name)}, ${esc(o.phone)}. ${esc(o.addr)}, ${esc(o.pin)}</p>${o.st==="CANCELLED"?`<p class="red"><b>This order was cancelled.</b></p>`:`<ol class="trk">${STEPS.map((s,k)=>`<li class="${k<=STEPS.findIndex(x=>x[0]===o.st)?"on":""}"><i></i>${s[1]}</li>`).join("")}</ol>`}</details>`;
const FL={ALL:["All Orders",()=>1],PROC:["Processing",o=>["PLACED","CONFIRMED","PREPARING"].includes(o.st)],SHIP:["Shipped",o=>o.st==="OUT"],DONE:["Delivered",o=>o.st==="DELIVERED"],CAN:["Cancelled",o=>o.st==="CANCELLED"]};
